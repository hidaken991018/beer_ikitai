name: Plan to PR

on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'ready-for-implementation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Substitute variables in prompt file
        run: |
          sed -e 's|\${REPOSITORY}|${{ github.repository }}|g' \
              -e 's|\${ISSUE_NUMBER}|${{ github.event.issue.number }}|g' \
              .github/prompts/implementation-prompt.md > ${{ runner.temp }}/implementation-prompt-processed.md

      - name: Run Implementation
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt_file: ${{ runner.temp }}/implementation-prompt-processed.md
          allowed_tools: |
            WebFetch,
            WebSearch,
            Write,
            Edit,
            MultiEdit,
            Read,
            LS,
            Glob,
            Grep,
            mcp__github__get_issue,
            mcp__github__create_branch,
            mcp__github__create_pull_request,
            mcp__github__update_issue,
            mcp__github__list_branches,
            mcp__github__create_or_update_file,
            mcp__github__update_pull_request,
            mcp__github__update_pull_request_branch,
            mcp__github__push_files,
            mcp__awslabs.aws-documentation-mcp-server__get_aws_documentation,
            mcp__awslabs.aws-documentation-mcp-server__search_aws_documentation,
            mcp__context7__resolve-library-id,
            mcp__context7__get-library-docs
          mcp_config: |
            {
              "mcpServers": {
                "github": {
                  "type": "http",
                  "url": "https://api.githubcopilot.com/mcp/",
                  "headers": {
                    "Authorization": "Bearer ${{ secrets.CLAUDE_CODE_GITHUB_MCP_ACCESS_TOKEN }}"
                  }
                },
                "context7": {
                  "type": "sse",
                  "url": "https://mcp.context7.com/sse"
                }
              },
              "inputs": [
                {
                  "type": "promptString",
                  "id": "github_mcp_pat",
                  "description": "GitHub Personal Access Token",
                  "password": true
                }
              ]
            }

          timeout_minutes: '20'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
