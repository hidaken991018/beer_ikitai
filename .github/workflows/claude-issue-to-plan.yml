name: Claude Code Issue to Plan

on:
  issues:
    types: [labeled]

jobs:
  plan:
    if: github.event.label.name == 'ready-for-plan'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run plan
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: '/plan-prompt ${{ github.repository }} ${{ github.event.issue.number }}'
          allowed_tools: |
            WebFetch,
            WebSearch,
            Write,
            Edit,
            MultiEdit,
            Read,
            LS,
            Glob,
            Grep,
            mcp__github__get_issue,
            mcp__github__update_issue,
            mcp__github__list_branches,
            mcp__context7__resolve-library-id,
            mcp__context7__get-library-docs
          mcp_config: |
            {
              "mcpServers": {
                "github": {
                  "type": "http",
                  "url": "https://api.githubcopilot.com/mcp/",
                  "headers": {
                    "Authorization": "Bearer ${{ secrets.CLAUDE_CODE_GITHUB_MCP_ACCESS_TOKEN }}"
                  }
                },
                "context7": {
                  "type": "sse",
                  "url": "https://mcp.context7.com/sse"
                }
              },
              "inputs": [
                {
                  "type": "promptString",
                  "id": "github_mcp_pat",
                  "description": "GitHub Personal Access Token",
                  "password": true
                }
              ]
            }

          timeout_minutes: '20'
          max_turns: '10'
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
